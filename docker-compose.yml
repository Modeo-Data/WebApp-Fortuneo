services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lineage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lineage}
      POSTGRES_DB: ${POSTGRES_DB:-lineage}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lineage} -d ${POSTGRES_DB:-lineage}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-lineage}:${POSTGRES_PASSWORD:-lineage}@postgres:5432/${POSTGRES_DB:-lineage}
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-mock}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: 'False'
      DJANGO_ALLOWED_HOSTS: '*'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
