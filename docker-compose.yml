version: '3.8'

services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-mock}
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - REDIS_URL=redis://redis:6379/0
      - DB_PATH=/data/db.sqlite3
    volumes:
      - db_data:/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
